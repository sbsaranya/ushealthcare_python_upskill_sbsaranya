# =====================================================================
# datasets.yaml - dataset settings for src/common/schema_reader.py
# Location: config/datasets.yaml
#
# Adding a new dataset = add an entry under "datasets". No script change.
# Column names in every rule below use the STANDARDIZED names (right-hand
# side of header_map), except header_map's own keys (raw file headers).
# =====================================================================

version: 3

# ---------------------------------------------------------------------
# Defaults - apply to every dataset, including files not listed below
# ---------------------------------------------------------------------
defaults:
  # Columns ending with these always stay text (IDs and codes keep leading zeros)
  force_string_suffixes: ["_ID", "_CODE", "_HCC_ID"]

  # Columns that always stay text, by exact name
  force_string_columns: ["SSN", "ZIP_CODE", "PHONE_NUMBER"]

  # Columns masked everywhere (schema samples, preview, logs)
  sensitive_columns:
    - SSN
    - MEDICARE_BENEFICIARY_ID
    - MEDICAID_ID
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - DATE_OF_BIRTH
    - TAX_ID_EIN

  # How many trailing characters stay visible when masking
  mask_visible_chars: 2

# ---------------------------------------------------------------------
# Datasets - processed in load_order (dependency order)
# ---------------------------------------------------------------------
datasets:

  account:
    description: Employer groups (level 1) and their child classes / locations (level 2)
    file_stem: raw_account          # matches raw_account.csv and raw_account.json
    load_order: 1
    depends_on: []                  # root of the chain

    # Raw business header -> standardized UPPER_SNAKE name
    header_map:
      "Account ID": ACCOUNT_HCC_ID
      "Account Name": ACCOUNT_NAME
      "Parent Account ID": PARENT_ACCOUNT_HCC_ID
      "Account Level": ACCOUNT_LEVEL
      "Account Type": ACCOUNT_TYPE
      "Status": ACCOUNT_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Term Reason": TERM_REASON
      "State": STATE_CODE
      "Funding Type": FUNDING_TYPE
      "Line of Business": LINE_OF_BUSINESS
      "Market Segment": MARKET_SEGMENT
      "Plan Year": PLAN_YEAR_TYPE
      "Renewal Month": RENEWAL_MONTH
      "Situs State": SITUS_STATE_CODE
      "Industry (NAICS)": INDUSTRY_NAICS
      "Tax ID (EIN – synthetic)": TAX_ID_EIN
      "Employee Class": EMPLOYEE_CLASS
      "Union Code": UNION_CODE
      "Waiting Period": WAITING_PERIOD
      "Min Hours / Week": MIN_HOURS_PER_WEEK
      "Eligible Employees": ELIGIBLE_EMPLOYEE_COUNT
      "Employer Contribution % (EE-only)": EMPLOYER_CONTRIB_PCT_EE
      "Separate Bill (Y/N)": SEPARATE_BILL_FLAG
      "Billing Frequency": BILLING_FREQUENCY
      "Stop-Loss Specific Deductible": STOP_LOSS_SPECIFIC_DEDUCTIBLE_AMT
      "Broker": BROKER_NAME
      "Account Manager": ACCOUNT_MANAGER_NAME

    # Declared types override inference. Allowed: string, date, integer,
    # decimal, percent ("80%" -> 0.80), currency ("$250,000.00" -> 250000.00)
    column_types:
      ACCOUNT_LEVEL: integer
      MIN_HOURS_PER_WEEK: integer
      ELIGIBLE_EMPLOYEE_COUNT: integer
      EMPLOYER_CONTRIB_PCT_EE: percent
      STOP_LOSS_SPECIFIC_DEDUCTIBLE_AMT: currency
      INDUSTRY_NAICS: string        # "332710 – Machine Shops"; split into code/description in Silver
      TAX_ID_EIN: string

    # Added to defaults.sensitive_columns for this dataset only
    sensitive_columns: []

    # Default columns for --preview keys
    preview_columns:
      - ACCOUNT_HCC_ID
      - ACCOUNT_NAME
      - PARENT_ACCOUNT_HCC_ID
      - ACCOUNT_LEVEL
      - ACCOUNT_STATUS
      - EFFECTIVE_DATE

    # Documentation only for now - checked in the Silver layer, not by the schema reader
    relationships:
      - column: PARENT_ACCOUNT_HCC_ID
        references: account.ACCOUNT_HCC_ID   # self-reference: child -> top account

  product:
    description: Commercial products (fully insured and self-funded ASO) that plans are built on
    file_stem: raw_product          # matches raw_product.csv and raw_product.json
    load_order: 2
    depends_on: []                  # reference data; no parent

    header_map:
      "Product ID": PRODUCT_ID
      "Product Name": PRODUCT_NAME
      "Line of Business": LINE_OF_BUSINESS
      "Funding Type": FUNDING_TYPE
      "Market Segment": MARKET_SEGMENT
      "Coverage Category": COVERAGE_CATEGORY
      "Status": PRODUCT_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Regulated By": REGULATED_BY
      "Filing State": FILING_STATE_CODE
      "Network Family": NETWORK_FAMILY
      "Total Plans": TOTAL_PLAN_COUNT
      "Active Plans": ACTIVE_PLAN_COUNT

    column_types:
      EFFECTIVE_DATE: date
      TERMINATION_DATE: date        # empty for every product today; declared so it isn't inferred as all-null text
      TOTAL_PLAN_COUNT: integer
      ACTIVE_PLAN_COUNT: integer
      FILING_STATE_CODE: string     # "N/A (not state-filed)" for ERISA products; becomes null + flag in Silver
      NETWORK_FAMILY: string        # list in one field; networks become their own entity later

    sensitive_columns: []           # reference data: no PHI, no confidential identifiers

    preview_columns:
      - PRODUCT_ID
      - PRODUCT_NAME
      - FUNDING_TYPE
      - PRODUCT_STATUS
      - EFFECTIVE_DATE
      - ACTIVE_PLAN_COUNT

    # Documentation only - checked in the Silver layer
    # TOTAL_PLAN_COUNT / ACTIVE_PLAN_COUNT must match the plan dataset (plan.PRODUCT_ID) once it exists
    relationships: []

  plan:
    description: Benefit plans (PPO, HMO, HDHP, EPO) built on each product, with cost-sharing design
    file_stem: raw_plan             # matches raw_plan.csv and raw_plan.json
    load_order: 3
    depends_on: [product]           # every plan belongs to a product

    header_map:
      "Benefit Plan ID": BENEFIT_PLAN_ID
      "Plan Name": PLAN_NAME
      "Product ID": PRODUCT_ID
      "Product Name": PRODUCT_NAME
      "Plan Type": PLAN_TYPE
      "Coverage Type": COVERAGE_TYPE
      "Funding Type": FUNDING_TYPE
      "Status": PLAN_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Term Reason": TERM_REASON
      "Replaced By Plan ID": REPLACED_BY_PLAN_ID
      "Network": NETWORK_NAME
      "Referral Required": REFERRAL_REQUIRED_FLAG
      "HSA Eligible": HSA_ELIGIBLE_FLAG
      "Deductible – Individual": DEDUCTIBLE_INDIVIDUAL_AMT
      "Deductible – Family": DEDUCTIBLE_FAMILY_AMT
      "Deductible Type": DEDUCTIBLE_TYPE
      "OOP Max – Individual": OOP_MAX_INDIVIDUAL_AMT
      "OOP Max – Family": OOP_MAX_FAMILY_AMT
      "OOP Max Type": OOP_MAX_TYPE
      "Coinsurance (Member Pays)": COINSURANCE_MEMBER_PCT
      "PCP Copay": PCP_COPAY
      "Specialist Copay": SPECIALIST_COPAY
      "ER Copay": ER_COPAY
      "Rx Structure": RX_STRUCTURE
      "Accumulator Period": ACCUMULATOR_PERIOD

    column_types:
      EFFECTIVE_DATE: date
      TERMINATION_DATE: date
      DEDUCTIBLE_INDIVIDUAL_AMT: currency   # "$1,000.00" -> 1000.00
      DEDUCTIBLE_FAMILY_AMT: currency
      OOP_MAX_INDIVIDUAL_AMT: currency
      OOP_MAX_FAMILY_AMT: currency
      COINSURANCE_MEMBER_PCT: percent       # "20%" -> 0.2000
      PCP_COPAY: string             # "$25.00" or "Deductible, then 10%" (HDHP); split into amount + flag in Silver
      SPECIALIST_COPAY: string
      ER_COPAY: string
      RX_STRUCTURE: string          # tier text, e.g. "4-tier: $10 / $35 / $70 / 25%"

    sensitive_columns: []           # reference data: no PHI, no confidential identifiers

    preview_columns:
      - BENEFIT_PLAN_ID
      - PLAN_NAME
      - PRODUCT_ID
      - PLAN_STATUS
      - DEDUCTIBLE_INDIVIDUAL_AMT
      - DEDUCTIBLE_TYPE

    # Documentation only - checked in the Silver layer
    # Also in Silver: PRODUCT_NAME / FUNDING_TYPE must match the product record;
    # HDHP plans must meet the IRS HDHP limits for the plan year.
    relationships:
      - column: PRODUCT_ID
        references: product.PRODUCT_ID
      - column: REPLACED_BY_PLAN_ID
        references: plan.BENEFIT_PLAN_ID    # self-reference: retired plan -> replacement plan
