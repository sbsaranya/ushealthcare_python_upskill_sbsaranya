# =====================================================================
# datasets.yaml - dataset settings for src/common/schema_reader.py
# Location: config/datasets.yaml
#
# Adding a new dataset = add an entry under "datasets". No script change.
# Column names in every rule below use the STANDARDIZED names (right-hand
# side of header_map), except header_map's own keys (raw file headers).
# =====================================================================

version: 3

# ---------------------------------------------------------------------
# Defaults - apply to every dataset, including files not listed below
# ---------------------------------------------------------------------
defaults:
  # Columns ending with these always stay text (IDs and codes keep leading zeros)
  force_string_suffixes: ["_ID", "_CODE", "_HCC_ID"]

  # Columns that always stay text, by exact name
  force_string_columns: ["SSN", "ZIP_CODE", "PHONE_NUMBER"]

  # Columns masked everywhere (schema samples, preview, logs)
  sensitive_columns:
    - SSN
    - MEDICARE_BENEFICIARY_ID
    - MEDICAID_ID
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - DATE_OF_BIRTH
    - TAX_ID_EIN

  # How many trailing characters stay visible when masking
  mask_visible_chars: 2

# ---------------------------------------------------------------------
# Datasets - processed in load_order (dependency order)
# ---------------------------------------------------------------------
datasets:

  account:
    description: Employer groups (level 1) and their child classes / locations (level 2)
    file_stem: raw_account          # matches raw_account.csv and raw_account.json
    load_order: 1
    depends_on: []                  # root of the chain

    # Raw business header -> standardized UPPER_SNAKE name
    header_map:
      "Account ID": ACCOUNT_HCC_ID
      "Account Name": ACCOUNT_NAME
      "Parent Account ID": PARENT_ACCOUNT_HCC_ID
      "Account Level": ACCOUNT_LEVEL
      "Account Type": ACCOUNT_TYPE
      "Status": ACCOUNT_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Term Reason": TERM_REASON
      "State": STATE_CODE
      "Funding Type": FUNDING_TYPE
      "Line of Business": LINE_OF_BUSINESS
      "Market Segment": MARKET_SEGMENT
      "Plan Year": PLAN_YEAR_TYPE
      "Renewal Month": RENEWAL_MONTH
      "Situs State": SITUS_STATE_CODE
      "Industry (NAICS)": INDUSTRY_NAICS
      "Tax ID (EIN – synthetic)": TAX_ID_EIN
      "Employee Class": EMPLOYEE_CLASS
      "Union Code": UNION_CODE
      "Waiting Period": WAITING_PERIOD
      "Min Hours / Week": MIN_HOURS_PER_WEEK
      "Eligible Employees": ELIGIBLE_EMPLOYEE_COUNT
      "Employer Contribution % (EE-only)": EMPLOYER_CONTRIB_PCT_EE
      "Separate Bill (Y/N)": SEPARATE_BILL_FLAG
      "Billing Frequency": BILLING_FREQUENCY
      "Stop-Loss Specific Deductible": STOP_LOSS_SPECIFIC_DEDUCTIBLE_AMT
      "Broker": BROKER_NAME
      "Account Manager": ACCOUNT_MANAGER_NAME

    # Declared types override inference. Allowed: string, date, integer,
    # decimal, percent ("80%" -> 0.80), currency ("$250,000.00" -> 250000.00)
    column_types:
      ACCOUNT_LEVEL: integer
      MIN_HOURS_PER_WEEK: integer
      ELIGIBLE_EMPLOYEE_COUNT: integer
      EMPLOYER_CONTRIB_PCT_EE: percent
      STOP_LOSS_SPECIFIC_DEDUCTIBLE_AMT: currency
      INDUSTRY_NAICS: string        # "332710 – Machine Shops"; split into code/description in Silver
      TAX_ID_EIN: string

    # Added to defaults.sensitive_columns for this dataset only
    sensitive_columns: []

    # Default columns for --preview keys
    preview_columns:
      - ACCOUNT_HCC_ID
      - ACCOUNT_NAME
      - PARENT_ACCOUNT_HCC_ID
      - ACCOUNT_LEVEL
      - ACCOUNT_STATUS
      - EFFECTIVE_DATE

    # Documentation only for now - checked in the Silver layer, not by the schema reader
    relationships:
      - column: PARENT_ACCOUNT_HCC_ID
        references: account.ACCOUNT_HCC_ID   # self-reference: child -> top account

  product:
    description: Commercial products (fully insured and self-funded ASO) that plans are built on
    file_stem: raw_product          # matches raw_product.csv and raw_product.json
    load_order: 2
    depends_on: []                  # reference data; no parent

    header_map:
      "Product ID": PRODUCT_ID
      "Product Name": PRODUCT_NAME
      "Line of Business": LINE_OF_BUSINESS
      "Funding Type": FUNDING_TYPE
      "Market Segment": MARKET_SEGMENT
      "Coverage Category": COVERAGE_CATEGORY
      "Status": PRODUCT_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Regulated By": REGULATED_BY
      "Filing State": FILING_STATE_CODE
      "Network Family": NETWORK_FAMILY
      "Total Plans": TOTAL_PLAN_COUNT
      "Active Plans": ACTIVE_PLAN_COUNT

    column_types:
      EFFECTIVE_DATE: date
      TERMINATION_DATE: date        # empty for every product today; declared so it isn't inferred as all-null text
      TOTAL_PLAN_COUNT: integer
      ACTIVE_PLAN_COUNT: integer
      FILING_STATE_CODE: string     # "N/A (not state-filed)" for ERISA products; becomes null + flag in Silver
      NETWORK_FAMILY: string        # list in one field; networks become their own entity later

    sensitive_columns: []           # reference data: no PHI, no confidential identifiers

    preview_columns:
      - PRODUCT_ID
      - PRODUCT_NAME
      - FUNDING_TYPE
      - PRODUCT_STATUS
      - EFFECTIVE_DATE
      - ACTIVE_PLAN_COUNT

    # Documentation only - checked in the Silver layer
    # TOTAL_PLAN_COUNT / ACTIVE_PLAN_COUNT must match the plan dataset (plan.PRODUCT_ID) once it exists
    relationships: []

  plan:
    description: Benefit plans (PPO, HMO, HDHP, EPO) built on each product, with cost-sharing design
    file_stem: raw_plan             # matches raw_plan.csv and raw_plan.json
    load_order: 3
    depends_on: [product]           # every plan belongs to a product

    header_map:
      "Benefit Plan ID": BENEFIT_PLAN_ID
      "Plan Name": PLAN_NAME
      "Product ID": PRODUCT_ID
      "Product Name": PRODUCT_NAME
      "Plan Type": PLAN_TYPE
      "Coverage Type": COVERAGE_TYPE
      "Funding Type": FUNDING_TYPE
      "Status": PLAN_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Term Reason": TERM_REASON
      "Replaced By Plan ID": REPLACED_BY_PLAN_ID
      "Network": NETWORK_NAME
      "Referral Required": REFERRAL_REQUIRED_FLAG
      "HSA Eligible": HSA_ELIGIBLE_FLAG
      "Deductible – Individual": DEDUCTIBLE_INDIVIDUAL_AMT
      "Deductible – Family": DEDUCTIBLE_FAMILY_AMT
      "Deductible Type": DEDUCTIBLE_TYPE
      "OOP Max – Individual": OOP_MAX_INDIVIDUAL_AMT
      "OOP Max – Family": OOP_MAX_FAMILY_AMT
      "OOP Max Type": OOP_MAX_TYPE
      "Coinsurance (Member Pays)": COINSURANCE_MEMBER_PCT
      "PCP Copay": PCP_COPAY
      "Specialist Copay": SPECIALIST_COPAY
      "ER Copay": ER_COPAY
      "Rx Structure": RX_STRUCTURE
      "Accumulator Period": ACCUMULATOR_PERIOD

    column_types:
      EFFECTIVE_DATE: date
      TERMINATION_DATE: date
      DEDUCTIBLE_INDIVIDUAL_AMT: currency   # "$1,000.00" -> 1000.00
      DEDUCTIBLE_FAMILY_AMT: currency
      OOP_MAX_INDIVIDUAL_AMT: currency
      OOP_MAX_FAMILY_AMT: currency
      COINSURANCE_MEMBER_PCT: percent       # "20%" -> 0.2000
      PCP_COPAY: string             # "$25.00" or "Deductible, then 10%" (HDHP); split into amount + flag in Silver
      SPECIALIST_COPAY: string
      ER_COPAY: string
      RX_STRUCTURE: string          # tier text, e.g. "4-tier: $10 / $35 / $70 / 25%"

    sensitive_columns: []           # reference data: no PHI, no confidential identifiers

    preview_columns:
      - BENEFIT_PLAN_ID
      - PLAN_NAME
      - PRODUCT_ID
      - PLAN_STATUS
      - DEDUCTIBLE_INDIVIDUAL_AMT
      - DEDUCTIBLE_TYPE

    # Documentation only - checked in the Silver layer
    # Also in Silver: PRODUCT_NAME / FUNDING_TYPE must match the product record;
    # HDHP plans must meet the IRS HDHP limits for the plan year.
    relationships:
      - column: PRODUCT_ID
        references: product.PRODUCT_ID
      - column: REPLACED_BY_PLAN_ID
        references: plan.BENEFIT_PLAN_ID    # self-reference: retired plan -> replacement plan

  account_plan:
    description: Which plans each child account offers (account-plan selection), with dates, tiers and default plan
    file_stem: raw_account_plan     # matches raw_account_plan.csv and raw_account_plan.json
    load_order: 4
    depends_on: [account, plan]

    header_map:
      "Plan Selection ID": PLAN_SELECTION_ID
      "Account ID": ACCOUNT_HCC_ID
      "Account Name": ACCOUNT_NAME
      "Top Account ID": TOP_ACCOUNT_HCC_ID
      "Benefit Plan ID": BENEFIT_PLAN_ID
      "Plan Name": PLAN_NAME
      "Status": SELECTION_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Term Reason": TERM_REASON
      "Coverage Tiers Offered": COVERAGE_TIERS_OFFERED
      "Default Plan (Y/N)": DEFAULT_PLAN_FLAG

    column_types:
      EFFECTIVE_DATE: date
      TERMINATION_DATE: date
      COVERAGE_TIERS_OFFERED: string   # "EE / EE+Spouse / EE+Child(ren) / Family"; one row per tier in Silver

    sensitive_columns: []           # reference data: no PHI, no confidential identifiers

    preview_columns:
      - PLAN_SELECTION_ID
      - ACCOUNT_HCC_ID
      - BENEFIT_PLAN_ID
      - SELECTION_STATUS
      - EFFECTIVE_DATE
      - DEFAULT_PLAN_FLAG

    # Documentation only - checked in the Silver layer
    # Natural key: ACCOUNT_HCC_ID + BENEFIT_PLAN_ID + EFFECTIVE_DATE (PLAN_SELECTION_ID is the surrogate key)
    # Silver rules: selection dates within account and plan dates; exactly one default plan per account per date;
    #   ACCOUNT_NAME / TOP_ACCOUNT_HCC_ID / PLAN_NAME must match their source records.
    # COBRA: COBRA sub-accounts list the union of their active groups' plans. A COBRA member may only elect plans
    #   offered to their ORIGINATING active account (similarly situated rule) - enforce at member level.
    relationships:
      - column: ACCOUNT_HCC_ID
        references: account.ACCOUNT_HCC_ID
      - column: TOP_ACCOUNT_HCC_ID
        references: account.ACCOUNT_HCC_ID
      - column: BENEFIT_PLAN_ID
        references: plan.BENEFIT_PLAN_ID

  subscriber:
    description: Subscribers (employees, COBRA continuees, retirees) - person-level demographics
    file_stem: raw_subscriber       # matches raw_subscriber.csv and raw_subscriber.json
    load_order: 5
    depends_on: []                  # account link lives in member_enrollment

    header_map:
      "Subscriber ID": SUBSCRIBER_ID
      "First Name": FIRST_NAME
      "Last Name": LAST_NAME
      "Gender": GENDER_CODE
      "Date of Birth": DATE_OF_BIRTH
      "Address Line 1": ADDRESS_LINE_1
      "City": CITY_NAME
      "State": STATE_CODE
      "ZIP": ZIP_CODE
      "Hire Date": HIRE_DATE
      "Employment Status": EMPLOYMENT_STATUS
      "Dependents": DEPENDENT_COUNT

    column_types:
      DATE_OF_BIRTH: date
      HIRE_DATE: date
      DEPENDENT_COUNT: integer      # must equal the subscriber's dependent rows in member (Silver)

    # Masking standard: HIPAA limited data set (45 CFR 164.514(e)) - names and street address removed;
    # town/city may remain. Stricter than LDS: ZIP_CODE and HIRE_DATE also masked (DATE_OF_BIRTH is in defaults).
    # CITY_NAME left visible: city names also appear in business account names (e.g. "Toledo Plant"),
    # which made the privacy check report false leaks when CITY_NAME was masked.
    sensitive_columns: [FIRST_NAME, LAST_NAME, ADDRESS_LINE_1, ZIP_CODE, HIRE_DATE]

    preview_columns:
      - SUBSCRIBER_ID
      - GENDER_CODE
      - STATE_CODE
      - EMPLOYMENT_STATUS
      - DEPENDENT_COUNT

    relationships: []

  member:
    description: All covered people - subscribers (relationship Subscriber) and their dependents
    file_stem: raw_member
    load_order: 6
    depends_on: [subscriber]

    header_map:
      "Member ID": MEMBER_ID
      "Subscriber ID": SUBSCRIBER_ID
      "Member Suffix": MEMBER_SUFFIX
      "Relationship": RELATIONSHIP
      "First Name": FIRST_NAME
      "Last Name": LAST_NAME
      "Gender": GENDER_CODE
      "Date of Birth": DATE_OF_BIRTH

    column_types:
      MEMBER_SUFFIX: string         # "01", "02" - keep leading zero
      DATE_OF_BIRTH: date

    sensitive_columns: [FIRST_NAME, LAST_NAME]   # DATE_OF_BIRTH is in defaults

    preview_columns:
      - MEMBER_ID
      - SUBSCRIBER_ID
      - MEMBER_SUFFIX
      - RELATIONSHIP
      - GENDER_CODE

    # Silver: subscriber row (suffix 01) name/DOB must match subscriber; children must be under 26
    # while covered as Child (ACA dependent coverage to age 26).
    relationships:
      - column: SUBSCRIBER_ID
        references: subscriber.SUBSCRIBER_ID

  member_enrollment:
    description: Each member's coverage spans - account, plan selection, plan, tier and dates
    file_stem: raw_member_enrollment
    load_order: 7
    depends_on: [member, account_plan]

    header_map:
      "Enrollment ID": ENROLLMENT_ID
      "Member ID": MEMBER_ID
      "Subscriber ID": SUBSCRIBER_ID
      "Member Name": MEMBER_NAME
      "Relationship": RELATIONSHIP
      "Account ID": ACCOUNT_HCC_ID
      "Top Account ID": TOP_ACCOUNT_HCC_ID
      "Plan Selection ID": PLAN_SELECTION_ID
      "Benefit Plan ID": BENEFIT_PLAN_ID
      "Coverage Tier": COVERAGE_TIER
      "Status": ENROLLMENT_STATUS
      "Effective Date": EFFECTIVE_DATE
      "Termination Date": TERMINATION_DATE
      "Term Reason": TERM_REASON

    column_types:
      EFFECTIVE_DATE: date
      TERMINATION_DATE: date
      COVERAGE_TIER: string         # populated on the subscriber row only; dependents inherit it

    sensitive_columns: [MEMBER_NAME]

    preview_columns:
      - ENROLLMENT_ID
      - MEMBER_ID
      - ACCOUNT_HCC_ID
      - BENEFIT_PLAN_ID
      - COVERAGE_TIER
      - ENROLLMENT_STATUS

    # Silver rules recorded so far:
    #  - dates within the plan selection; no overlapping spans per member; tier offered by the account
    #  - tier matches the dependents covered on that date
    #  - ACA waiting period: first coverage start <= hire date + 90 days (and the account's own rule)
    #  - HIPAA special enrollment: newborn coverage effective on the date of birth
    #  - COBRA: plan must be offered to the ORIGINATING active account (previous enrollment row);
    #    termination of employment max 18 months; loss of dependent status / Medicare entitlement up to 36;
    #    every coverage loss caused by a qualifying event needs a COBRA offer recorded
    relationships:
      - column: MEMBER_ID
        references: member.MEMBER_ID
      - column: PLAN_SELECTION_ID
        references: account_plan.PLAN_SELECTION_ID
      - column: ACCOUNT_HCC_ID
        references: account.ACCOUNT_HCC_ID
      - column: BENEFIT_PLAN_ID
        references: plan.BENEFIT_PLAN_ID

  transaction_code:
    description: Reference list of coverage transaction codes and their X12 834 maintenance types
    file_stem: raw_transaction_code
    load_order: 8
    depends_on: []                  # reference data

    header_map:
      "Code": TRANSACTION_CODE
      "Description": TRANSACTION_DESCRIPTION
      "What it means": TRANSACTION_MEANING
      "X12 834 Maintenance Type": X12_834_MAINTENANCE_TYPE

    column_types:
      X12_834_MAINTENANCE_TYPE: string   # "021 – Addition"; Silver splits into code (021) + text, keeping the leading zero

    sensitive_columns: []

    preview_columns:
      - TRANSACTION_CODE
      - TRANSACTION_DESCRIPTION
      - X12_834_MAINTENANCE_TYPE

    # X12 834 INS03 maintenance types: 001 Change, 021 Addition, 024 Cancellation/Termination,
    # 025 Reinstatement, 030 Audit or Compare (030 not used by this code set)
    relationships: []

  coverage_transaction:
    description: Event history of coverage changes (add, plan change, tier change, account transfer, termination)
    file_stem: raw_coverage_transaction
    load_order: 9
    depends_on: [member_enrollment, transaction_code]

    header_map:
      "Transaction ID": TRANSACTION_ID
      "Member ID": MEMBER_ID
      "Subscriber ID": SUBSCRIBER_ID
      "Member Name": MEMBER_NAME
      "Transaction Code": TRANSACTION_CODE
      "Transaction Description": TRANSACTION_DESCRIPTION
      "Effective Date": EFFECTIVE_DATE
      "Status": TRANSACTION_STATUS
      "Enrollment ID": ENROLLMENT_ID
      "Account ID": ACCOUNT_HCC_ID
      "Previous Account ID": PREVIOUS_ACCOUNT_HCC_ID
      "Benefit Plan ID": BENEFIT_PLAN_ID
      "Previous Benefit Plan ID": PREVIOUS_BENEFIT_PLAN_ID
      "Coverage Tier": COVERAGE_TIER
      "Previous Coverage Tier": PREVIOUS_COVERAGE_TIER
      "Reason": TRANSACTION_REASON
      "Source": TRANSACTION_SOURCE
      "Processed Date": PROCESSED_DATE
      "Retro (Y/N)": RETRO_FLAG

    column_types:
      EFFECTIVE_DATE: date          # for code T this is the LAST day covered; for all other codes the first day
      PROCESSED_DATE: date
      PREVIOUS_COVERAGE_TIER: string

    sensitive_columns: [MEMBER_NAME]

    preview_columns:
      - TRANSACTION_ID
      - MEMBER_ID
      - TRANSACTION_CODE
      - EFFECTIVE_DATE
      - PROCESSED_DATE
      - RETRO_FLAG

    # Silver rules recorded so far:
    #  - RETRO_FLAG = Y exactly when PROCESSED_DATE > EFFECTIVE_DATE
    #  - TRANSACTION_STATUS = Future-dated when EFFECTIVE_DATE is after the as-of date, else Applied
    #  - PL needs PREVIOUS_BENEFIT_PLAN_ID; TC needs PREVIOUS_COVERAGE_TIER; AT needs a different PREVIOUS_ACCOUNT_HCC_ID
    #  - every enrollment span is opened by exactly one non-T transaction; T dates = enrollment termination dates
    #  - HIPAA special enrollment: birth processed within the plan's request window (at least 30 days)
    #  - COBRA: election period at least 60 days after the later of loss of coverage or the election notice
    relationships:
      - column: ENROLLMENT_ID
        references: member_enrollment.ENROLLMENT_ID
      - column: TRANSACTION_CODE
        references: transaction_code.TRANSACTION_CODE
      - column: MEMBER_ID
        references: member.MEMBER_ID
